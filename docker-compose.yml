services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consentia
      POSTGRES_PASSWORD: consentia_dev
      POSTGRES_DB: consentia
    ports:
      - "5432:5432"
    volumes:
      - consentia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consentia -d consentia"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://consentia:consentia_dev@postgres:5432/consentia?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  consentia_pgdata:
