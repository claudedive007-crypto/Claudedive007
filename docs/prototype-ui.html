/* ---------- RADIAL FAN-OUT MAP ---------- */
function radialMap(){
  const cx=270, cy=196, r=134, n=SYSTEMS.length;
  let spokes='', nodes='';
  SYSTEMS.forEach((s,i)=>{
    const a=(-90+i*(360/n))*Math.PI/180;
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    const len=Math.hypot(x-cx,y-cy);
    spokes+=`<line class="rspoke" id="sp-${s.id}" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>
             <line class="rflow" id="fl-${s.id}" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--blue)" style="--len:${len.toFixed(1)}"/>`;
    const ty = y < cy-40 ? y-30 : y+34;
    nodes+=`<g class="rnode" id="nd-${s.id}" onclick="go('#/enterprise/${s.id}')">
      <circle class="n" cx="${x}" cy="${y}" r="17" fill="#fff" stroke="var(--line)" stroke-width="2"/>
      <text x="${x}" y="${y+3.5}" text-anchor="middle" style="font-size:8px;fill:var(--ink-3)">${s.name.split(' ').map(w=>w[0]).join('').slice(0,3)}</text>
      <text x="${x}" y="${ty}" text-anchor="middle">${esc(s.name)}</text>
      <text x="${x}" y="${ty+11}" text-anchor="middle" class="sub" id="nl-${s.id}">idle</text>
    </g>`;
  });
  return `<div class="radial"><svg viewBox="0 0 540 400" role="img" aria-label="Fan-out map: consent engine connected to ${n} systems">
    ${spokes}
    <g class="rhub" id="rHub">
      <circle class="ring" cx="${cx}" cy="${cy}" r="30" fill="none" stroke="var(--blue)" stroke-width="2" opacity="0"/>
      <circle class="core" cx="${cx}" cy="${cy}" r="30" fill="var(--navy)"/>
      <text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#fff">CONSENT</text>
      <text x="${cx}" y="${cy+10}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#fff">ENGINE</text>
    </g>
    ${nodes}
  </svg></div>`;
}
function fireRadial(){
  const hub=$('#rHub'); if(!hub) return;
  hub.classList.add('fire');
  SYSTEMS.forEach(s=>{
    const sp=$('#sp-'+s.id), fl=$('#fl-'+s.id), nd=$('#nd-'+s.id), nl=$('#nl-'+s.id);
    if(sp) sp.className.baseVal='rspoke';
    if(fl){ fl.classList.remove('go'); fl.setAttribute('stroke','var(--blue)'); }
    if(nd){ nd.classList.remove('hit'); const c=nd.querySelector('circle.n'); c.setAttribute('fill','#fff'); c.setAttribute('stroke','var(--line)'); }
    if(nl){ nl.textContent='dispatching…'; nl.style.fill='var(--blue)'; }
  });
  ORCH_PLAN.forEach(p=>{
    const fl=$('#fl-'+p.id); if(fl) setTimeout(()=>fl.classList.add('go'),40);
    setTimeout(()=>{
      const ok=p.r==='ack', retry=p.r==='retry';
      const col=ok?'var(--green)':retry?'var(--amber)':'var(--red)';
      const nd=$('#nd-'+p.id), nl=$('#nl-'+p.id), sp=$('#sp-'+p.id), f=$('#fl-'+p.id);
      if(f) f.setAttribute('stroke',col);
      if(sp) sp.className.baseVal='rspoke '+(ok?'ok':retry?'on':'bad');
      if(nd){ nd.classList.add('hit');
        const c=nd.querySelector('circle.n');
        c.setAttribute('fill',ok?'var(--green-lt)':retry?'var(--amber-lt)':'var(--red-lt)');
        c.setAttribute('stroke',col);
        setTimeout(()=>nd.classList.remove('hit'),380); }
      if(nl){ nl.textContent=ok?'stopped':retry?'retrying…':'failed → DLQ'; nl.style.fill=col; }
      if(retry) setTimeout(()=>{
        const c2=$('#nd-mkt')&&$('#nd-mkt').querySelector('circle.n'), l2=$('#nl-mkt'), s2=$('#sp-mkt'), f2=$('#fl-mkt');
        if(c2){c2.setAttribute('fill','var(--green-lt)');c2.setAttribute('stroke','var(--green)');}
        if(l2){l2.textContent='stopped on retry';l2.style.fill='var(--green)';}
        if(s2) s2.className.baseVal='rspoke ok';
        if(f2) f2.setAttribute('stroke','var(--green)');
      },900);
    }, p.ms+320);
  });
  setTimeout(()=>hub.classList.remove('fire'),2100);
}

/* ---------- PERMISSION GRID ---------- */
const PG_PURPOSES=[
  {n:'KYC Verification',lg:'Legal obligation'},{n:'Account Opening',lg:'Contract'},
  {n:'Loan Processing',lg:'Contract'},{n:'Credit Bureau Check',lg:'Legal + consent'},
  {n:'Marketing',lg:'Consent'},{n:'Insurance Cross-Sell',lg:'Consent'},
  {n:'Third Party Sharing',lg:'Consent'},{n:'Analytics & Profiling',lg:'Consent'},
];
const PG_M=[
  ['a','a','a','n','n','a','a','b'],['a','a','a','n','a','a','n','b'],
  ['a','a','a','n','a','a','a','b'],['a','a','n','n','n','a','a','b'],
  ['n','n','a','b','r','r','b','b'],['n','a','a','b','r','r','b','b'],
  ['n','a','r','b','n','a','a','b'],['n','n','r','b','n','a','b','b'],
];
const PG_K={a:{l:'ALLOW',g:'✓'},b:{l:'BLOCK',g:'✕'},r:{l:'ALLOW · AT RISK',g:'!'},n:{l:'NOT APPLICABLE',g:'–'}};
function pgReason(pi,si,k){
  const S=SYSTEMS[si].name, P=PG_PURPOSES[pi].n;
  if(k==='n') return `${S} has no processing activity registered for ${P}. Nothing is blocked because nothing is requested — this pairing does not exist in the data map.`;
  if(k==='b'){
    if(si===7) return `The Snowflake connector is offline — key-pair credentials expired 4 hours ago. Every decision to the warehouse is failing closed, which is correct: no consent can be proven, so nothing is permitted.`;
    if(si===3) return `The data processing agreement with CloudMailer Inc. lapsed on 11 Jul 2026. All marketing data sharing to this processor is auto-blocked until a new DPA is signed and recorded.`;
    if(si===6) return `Experian is a registered processor for bureau and loan purposes only. ${P} falls outside the purposes named in their agreement, so sharing is refused.`;
    return `No valid consent basis exists for ${P} on ${S}.`;
  }
  if(k==='r'){
    if(si===4) return `Allowed, but 1,842 of the underlying consents lapse within 30 days and no renewal drive is scheduled. This cell begins turning red from 13 Aug unless consents are refreshed.`;
    if(si===5) return `Allowed, but retention rules for ${P} on ${S} are not configured. Data is permitted in, with no automatic deletion at end of purpose.`;
    return `Allowed today, with a condition that needs attention before it becomes a block.`;
  }
  if(pi<=3) return `${P} runs on a legal or contractual basis, so processing on ${S} is permitted regardless of marketing preferences. Withdrawal of consent does not affect it.`;
  return `Valid, unexpired consent is on file for ${P}, and ${S} is a registered processor for it. Every request is logged to the audit chain.`;
}
function pgTally(){const c={a:0,b:0,r:0,n:0};PG_M.forEach(r=>r.forEach(k=>c[k]++));return c;}
function permissionGrid(){
  const t=pgTally();
  let h='<thead><tr><th></th>';
  SYSTEMS.forEach(s=>h+=`<th class="sysh">${esc(s.name)}<span class="vd"> · ${esc(s.vendor)}</span></th>`);
  h+='</tr></thead><tbody>';
  PG_PURPOSES.forEach((p,pi)=>{
    h+=`<tr><th class="purh">${esc(p.n)}<span class="lg">${p.lg}</span></th>`;
    SYSTEMS.forEach((s,si)=>{
      const k=PG_M[pi][si];
      h+=`<td><div class="pcell ${k}" id="pg${pi}_${si}" style="animation-delay:${(pi*8+si)*9}ms" onclick="pgPick(${pi},${si})">${PG_K[k].g}</div></td>`;
    });
    h+='</tr>';
  });
  return `<div class="card">
    <div class="card-h"><div><h2>Permission grid</h2><div class="hint">${PG_M.flat().length} live decisions · what every system may do, right now</div></div>
      <div class="acts"><span class="xs" style="color:var(--ink-4)"><b style="color:var(--red)">${t.b} blocked</b> · <b style="color:var(--amber)">${t.r} at risk</b> · ${t.a} allowed · ${t.n} n/a</span></div></div>
    <div class="card-b">
      <div class="grid" style="grid-template-columns:1fr 292px;gap:14px;align-items:start">
        <div>
          <div class="pgwrap"><table class="pg">${h}</tbody></table></div>
          <div class="pglegend">
            <span><i style="background:var(--green-lt);border:1.5px solid var(--green)"></i>Allowed</span>
            <span><i style="background:var(--red-lt);border:1.5px solid var(--red)"></i>Blocked</span>
            <span><i style="background:var(--amber-lt);border:1.5px solid var(--amber)"></i>Allowed, at risk</span>
            <span><i style="background:var(--line-2)"></i>Not applicable</span>
            <span style="margin-left:auto"><button class="btn btn-t btn-sm" onclick="pgDemo()">${IC.play(12)} Watch a DPA expire</button></span>
          </div>
        </div>
        <div class="pgdetail" id="pgDetail"></div>
      </div>
    </div></div>`;
}
function pgPick(pi,si){
  document.querySelectorAll('.pcell').forEach(c=>c.classList.remove('sel'));
  const el=$('#pg'+pi+'_'+si); if(el) el.classList.add('sel');
  const k=PG_M[pi][si], K=PG_K[k];
  const d=$('#pgDetail'); if(!d) return;
  d.innerHTML=`<div style="font-size:13.5px;font-weight:700">${esc(PG_PURPOSES[pi].n)}</div>
    <div class="xs muted" style="margin-bottom:11px">on ${esc(SYSTEMS[si].name)} · ${esc(SYSTEMS[si].vendor)}</div>
    <div class="verdict ${k}">${K.g} ${K.l}</div>
    <div class="kv"><span class="k">Legal basis</span><span class="v">${PG_PURPOSES[pi].lg}</span></div>
    <div class="kv"><span class="k">Decision time</span><span class="v">${k==='n'?'—':(18+((pi*7+si*3)%26))+' ms'}</span></div>
    <div class="kv"><span class="k">Checked</span><span class="v">${k==='n'?'—':'continuously'}</span></div>
    <div class="pgreason">${pgReason(pi,si,k)}</div>`;
}
/* micro-demo: a DPA lapses and a whole column flips red */
function pgDemo(){
  const col=3; // Marketing Automation
  toast('CloudMailer DPA expired','Watch the marketing column fail closed','warn');
  PG_PURPOSES.forEach((p,pi)=>{
    if(PG_M[pi][col]==='n') return;
    setTimeout(()=>{
      const el=$('#pg'+pi+'_'+col); if(!el) return;
      el.classList.add('flip');
      setTimeout(()=>{el.classList.remove('flip','a','r');el.classList.add('b');el.textContent='✕';},300);
    }, pi*130);
  });
  setTimeout(()=>pgPick(4,3),1100);
}

/* ---------- LIFESPAN RIBBON (customer 360) ---------- */
function lifespanRibbon(cid){
  const cs=(byCust[cid]||[]).slice(0,6);
  if(!cs.length) return '';
  const t0=Math.min(...cs.map(c=>+c.captured)), t1=+NOW;
  const span=Math.max(1,t1-t0);
  const rows=cs.map((c,i)=>{
    const s=Math.max(0,(+c.captured-t0)/span*100);
    const end = c.status==='Withdrawn'&&c.withdrawnAt ? +c.withdrawnAt
              : c.status==='Expired' ? Math.min(+c.expires,t1) : t1;
    const w=Math.max(2,(end-(+c.captured))/span*100);
    const k=c.status==='Withdrawn'?'wd':c.status==='Expired'?'exp':'act';
    const label=c.status==='Withdrawn'?'withdrawn':c.status==='Expired'?'expired':'active';
    return `<div class="ribbon">
      <span class="rlab" title="${esc(c.pname)}">${esc(c.pname)}</span>
      <div class="rtrack">
        <div class="rseg ${k}" style="left:${s.toFixed(1)}%;width:${w.toFixed(1)}%;animation-delay:${i*70}ms"
             title="${esc(c.pname)} · ${label} · ${fmtD(c.captured)}"></div>
      </div></div>`;
  }).join('');
  return `<div class="card mt"><div class="card-h">
      <div><h2>Consent over time</h2><div class="hint">Every purpose this customer has held, and when</div></div></div>
    <div class="card-b">
      ${rows}
      <div class="rscale"><span>${fmtD(new Date(t0))}</span><span>today</span></div>
      <div class="pglegend" style="margin-top:12px">
        <span><i class="rseg act" style="position:static;animation:none"></i>Active</span>
        <span><i class="rseg wd" style="position:static;animation:none"></i>Withdrawn</span>
        <span><i class="rseg exp" style="position:static;animation:none"></i>Expired</span>
      </div>
    </div></div>`;
}

    <h3 style="margin:18px 0 10px">Consent sharing rules</h3>
    <div class="col" style="gap:8px">
      ${v.purposes.map(p=>`<label class="chk on"><input type="checkbox" checked ${v.s==='Non-compliant'?'disabled':''}>
        <div><div class="t">${p}</div><div class="d">Share only where a live consent names this processor and the purpose matches.</div></div></label>`).join('')}
      <label class="chk"><input type="checkbox"><div><div class="t">Allow onward transfer</div><div class="d">Off by default. Sub-processors must be named in the notice before this can be turned on.</div></div></label>
    </div>`,
    `<button class="btn btn-o" onclick="closeLayer()">Close</button>
     ${v.s==='Non-compliant'
       ? `<button class="btn btn-p" onclick="closeLayer();toast('DPA renewal requested','Legal and the vendor have been notified')">${IC.send(14)} Request new DPA</button>`
       : `<button class="btn btn-d" onclick="closeLayer();toast('Sharing suspended','${v.n} will be refused on the next call','warn')">${IC.x(14)} Suspend sharing</button>`}`);
}

/* ================= ROUTER ================= */
function router(){
  const [path,qs]=location.hash.slice(2).split('?');
  const parts=(path||'dashboard').split('/');
  const params=new URLSearchParams(qs||'');
  closeLayer();
  renderNav();
  const r=parts[0];
  try{
    if(r==='dashboard'||r==='') vDashboard();
    else if(r==='capture') parts[1]?vCaptureChannel(parts[1]):vCapture();
    else if(r==='repository'){
      if(parts[1]==='c'&&parts[2]) vCustomer(parts[2]);
      else if(parts[1]) vConsent(parts[1]);
      else vRepository(params);
    }
    else if(r==='drives') parts[1]?vDriveDetail(parts[1]):vDrives();
    else if(r==='health') vHealth();
    else if(r==='validation') vValidation();
    else if(r==='privacy') vPrivacy(params);
    else if(r==='enterprise'){
      if(parts[1]==='demo') vDemo();
      else if(parts[1]) vConnector(parts[1]);
      else vEnterprise();
    }
    else if(r==='orchestration') vOrch();
    else if(r==='workflows') vWorkflow();
    else if(r==='preference') vPreference();
    else if(r==='workflow') vWorkflow();
    else if(r==='preferences') vPreference();
    else if(r==='breach') parts[1]?vBreachDetail(parts[1]):vBreach();
    else if(r==='children') vChildren();
    else if(r==='sdf') vSDF();
    else if(r==='notifications') vNotifs();
    else if(r==='ai') vAI();
    else if(r==='developers') vDev();
    else if(r==='audit') vAudit();
    else if(r==='reports') vReports();
    else if(r==='admin') vAdmin();
    else if(r==='settings') vSettings();
    else vDashboard();
  }catch(e){
    V().innerHTML=`<div class="card"><div class="empty"><div class="ic">${IC.alert(22)}</div><h3>That screen didn't load</h3><p class="mono xs">${esc(e.message)}</p><button class="btn btn-p" onclick="go('#/dashboard')">Back to dashboard</button></div></div>`;
    console.error(e);
  }
}
window.addEventListener('hashchange',router);
if(!location.hash) location.hash='#/dashboard';
router();

/* live pulse in the header */
let checks=1840;
setInterval(()=>{
  checks+=ri(8,34);
  const el=$('#pulseTxt'); if(el) el.textContent='Consent engine live · '+nf(checks)+' checks/min';
},2200);
</script>
