<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Consentia — DPDP Consent & Privacy Governance Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --ink:#0A1B33;            /* headline navy */
  --navy:#0B2545;           /* deep navy (used by workflow/preference/breach modules) */
  --ink-2:#33475F;          /* body */
  --ink-3:#6B7F99;          /* muted */
  --ink-4:#9AAABE;          /* faint */
  --blue:#1B5FD1;           /* primary */
  --blue-dk:#12448F;
  --blue-lt:#EAF1FD;
  --blue-lt2:#D6E4FA;
  --green:#0EA672;          /* accent */
  --green-lt:#E4F7EF;
  --red:#DC2B45;
  --red-lt:#FDECEE;
  --amber:#C8860D;
  --amber-lt:#FDF3E0;
  --violet:#6C4BD8;
  --violet-lt:#F0ECFD;
  --bg:#F4F7FC;
  --surface:#FFFFFF;
  --line:#E3EAF3;
  --line-2:#EFF3F9;
  --shadow-s:0 1px 2px rgba(10,27,51,.05), 0 1px 3px rgba(10,27,51,.04);
  --shadow-m:0 4px 14px rgba(10,27,51,.07), 0 1px 3px rgba(10,27,51,.04);
  --shadow-l:0 18px 50px rgba(10,27,51,.16);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --sans:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --nav-w:248px; --hdr-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink-2);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.006em;
}
h1,h2,h3,h4,h5{color:var(--ink); font-weight:600; letter-spacing:-.02em; line-height:1.25}
h1{font-size:21px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
a{color:var(--blue); text-decoration:none}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9D5E4;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono); font-size:12px; letter-spacing:-.02em}

/* ============ APP SHELL ============ */
.app{display:flex; min-height:100vh}
.hdr{
  position:fixed; top:0; left:0; right:0; height:var(--hdr-h); z-index:60;
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; padding:0 18px;
}
.brand{display:flex; align-items:center; gap:10px; width:calc(var(--nav-w) - 18px); flex-shrink:0; cursor:pointer}
.brand-mark{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(145deg,var(--blue) 0%,#2E7BEA 55%,var(--green) 165%);
  display:grid;place-items:center; box-shadow:0 3px 10px rgba(27,95,209,.35);
}
.brand-name{font-weight:700;color:var(--ink);font-size:16px;letter-spacing:-.03em;line-height:1.1}
.brand-sub{font-size:10px;color:var(--ink-4);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.gsearch{position:relative; flex:1; max-width:460px}
.gsearch input{
  width:100%; height:36px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); padding:0 12px 0 36px; color:var(--ink); transition:.15s;
}
.gsearch input:focus{outline:none;background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.gsearch input::placeholder{color:var(--ink-4)}
.gsearch svg{position:absolute;left:11px;top:9px;color:var(--ink-4)}
.gsearch kbd{
  position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:10px;color:var(--ink-4);
  border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:#fff
}
.hdr-spacer{flex:1}
.hdr-pulse{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;
  background:var(--green-lt);color:#0A7D56;font-size:11.5px;font-weight:600;white-space:nowrap;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);
  position:relative; transition:.12s;
}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--blue-lt);color:var(--blue-dk);
  display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid var(--blue-lt2);cursor:pointer
}
.user-chip{display:flex;align-items:center;gap:9px;padding:3px 8px 3px 3px;border-radius:99px;transition:.12s}
.user-chip:hover{background:var(--bg)}
.user-name{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2}
.user-role{font-size:10.5px;color:var(--ink-4)}

/* ============ SIDEBAR ============ */
.nav{
  position:fixed;top:var(--hdr-h);bottom:0;left:0;width:var(--nav-w);z-index:50;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 12px 12px;overflow-y:auto;
}
.nav-label{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);
  padding:0 10px;margin:14px 0 6px;
}
.nav-label:first-child{margin-top:0}
.nav-item{
  display:flex;align-items:center;gap:11px;height:37px;padding:0 10px;border-radius:9px;
  color:var(--ink-2);font-weight:500;font-size:13.5px;width:100%;text-align:left;transition:.12s;position:relative;
}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.on{background:var(--blue-lt);color:var(--blue-dk);font-weight:600}
.nav-item.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item .cnt{
  margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bg);color:var(--ink-3);
  padding:1px 6px;border-radius:99px;font-family:var(--mono)
}
.nav-item.on .cnt{background:#fff;color:var(--blue)}
.nav-foot{
  margin-top:auto;padding:12px;border-radius:var(--r-m);background:linear-gradient(160deg,#0A1B33,#173766);color:#fff;
}
.nav-foot .t{font-size:12.5px;font-weight:600;color:#fff}
.nav-foot .s{font-size:11px;color:#9DB4D4;margin:2px 0 9px}
.nav-foot button{
  width:100%;height:30px;border-radius:7px;background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;font-weight:600;
  border:1px solid rgba(255,255,255,.16)
}
.nav-foot button:hover{background:rgba(255,255,255,.2)}

/* ============ MAIN ============ */
.main{margin-left:var(--nav-w);margin-top:var(--hdr-h);flex:1;min-width:0;padding:22px 26px 60px;max-width:1600px}
.crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-4);margin-bottom:9px;font-weight:500}
.crumb b{color:var(--ink-3);font-weight:600}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .sub{color:var(--ink-3);font-size:13px;margin-top:4px;max-width:720px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ BUTTONS ============ */
.btn{
  height:34px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;transition:.13s;border:1px solid transparent;white-space:nowrap;
}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(27,95,209,.3)}
.btn-p:hover{background:var(--blue-dk)}
.btn-g{background:var(--green);color:#fff}
.btn-g:hover{background:#0B8A5E}
.btn-o{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-o:hover{background:var(--bg);border-color:#CFDBE9}
.btn-d{background:#fff;color:var(--red);border-color:#F3CDD3}
.btn-d:hover{background:var(--red-lt)}
.btn-t{background:transparent;color:var(--ink-3)}
.btn-t:hover{background:var(--bg);color:var(--ink)}
.btn-sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn-lg{height:42px;padding:0 20px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%;justify-content:center}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-s)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-h .hint{font-size:11.5px;color:var(--ink-4);font-weight:500}
.card-b{padding:18px}
.card-f{padding:11px 18px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.g-2-1{grid-template-columns:2fr 1fr} .g-1-2{grid-template-columns:1fr 2fr}
.g-3-2{grid-template-columns:3fr 2fr}
.clickable{cursor:pointer;transition:.15s}
.clickable:hover{border-color:#C6D8F2;box-shadow:var(--shadow-m);transform:translateY(-2px)}

/* ============ KPI ============ */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:15px 16px;box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.kpi .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:700;color:var(--ink);letter-spacing:-.035em;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.kpi .dlt{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.up{color:var(--green)} .dn{color:var(--red)} .flat{color:var(--ink-4)}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.5}
.kpi-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}

/* ============ BADGES / PILLS ============ */
.bdg{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.bdg::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.bdg.nodot::before{display:none}
.b-green{background:var(--green-lt);color:#0A7D56}
.b-blue{background:var(--blue-lt);color:var(--blue-dk)}
.b-red{background:var(--red-lt);color:#B21F36}
.b-amber{background:var(--amber-lt);color:#9C6A08}
.b-gray{background:#F1F5F9;color:var(--ink-3)}
.b-violet{background:var(--violet-lt);color:#553BB0}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);font-size:11px;color:var(--ink-2);font-weight:500}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;
  padding:9px 14px;background:#FAFCFE;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.row{cursor:pointer;transition:background .1s}
tbody tr.row:hover{background:#F8FBFF}
td .pri{font-weight:600;color:var(--ink)}
.cust{display:flex;align-items:center;gap:9px}
.cust .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.tbl-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.srch{position:relative;flex:1;min-width:200px;max-width:330px}
.srch input{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 10px 0 31px}
.srch input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.srch svg{position:absolute;left:9px;top:8px;color:var(--ink-4)}
select.fl,input.fl{
  height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 9px;color:var(--ink-2);
  font-weight:500;font-size:12.5px;cursor:pointer
}
select.fl:focus,input.fl:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.pager{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--line-2)}
.pager .info{font-size:12px;color:var(--ink-3);margin-right:auto}
.pg{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-2);display:grid;place-items:center}
.pg:hover{background:var(--bg)} .pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg:disabled{opacity:.4}
.empty{padding:52px 20px;text-align:center}
.empty .ic{width:46px;height:46px;border-radius:13px;background:var(--bg);display:grid;place-items:center;margin:0 auto 12px;color:var(--ink-4)}
.empty h3{margin-bottom:5px} .empty p{color:var(--ink-3);font-size:13px;margin-bottom:14px}

/* ============ FORMS ============ */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
.fld .req{color:var(--red)}
.fld .help{font-size:11.5px;color:var(--ink-4);margin-top:4px}
.inp{
  width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 11px;
  color:var(--ink);transition:.13s
}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;line-height:1.55}
select.inp{cursor:pointer}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.inp:disabled{background:var(--bg);color:var(--ink-3)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.13s;background:#fff}
.chk:hover{border-color:#C6D8F2;background:#FBFDFF}
.chk.on{border-color:var(--blue);background:var(--blue-lt)}
.chk input{margin-top:2px;width:15px;height:15px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.chk .t{font-size:13px;font-weight:600;color:var(--ink)}
.chk .d{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{height:26px;padding:0 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--blue-dk);box-shadow:var(--shadow-s)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{
  padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ============ MISC BLOCKS ============ */
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-weight:500} .kv .v{color:var(--ink);font-weight:600;text-align:right}
.note{border-radius:10px;padding:11px 13px;font-size:12.5px;display:flex;gap:9px;line-height:1.5}
.note svg{flex-shrink:0;margin-top:1px}
.n-blue{background:var(--blue-lt);color:var(--blue-dk)}
.n-green{background:var(--green-lt);color:#0A7D56}
.n-amber{background:var(--amber-lt);color:#9C6A08}
.n-red{background:var(--red-lt);color:#B21F36}
.n-gray{background:var(--bg);color:var(--ink-2)}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .6s cubic-bezier(.4,0,.2,1)}
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.stat-row .n{font-size:12.5px;font-weight:600;color:var(--ink);min-width:130px}
.stat-row .bar{flex:1}
.stat-row .v{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:46px;text-align:right;font-family:var(--mono)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i .dot{position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.tl-i.g .dot{border-color:var(--green)} .tl-i.r .dot{border-color:var(--red)} .tl-i.a .dot{border-color:var(--amber)}
.tl-i .t{font-size:13px;font-weight:600;color:var(--ink)}
.tl-i .m{font-size:11.5px;color:var(--ink-4);margin-top:1px}
.tl-i .d{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* activity feed */
.feed-i{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.feed-i:last-child{border-bottom:none}
.feed-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.feed-i .t{font-size:13px;color:var(--ink);line-height:1.45}
.feed-i .t b{font-weight:600}
.feed-i .m{font-size:11.5px;color:var(--ink-4);margin-top:2px;display:flex;gap:7px;align-items:center}

/* channel / connector cards */
.ch-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:17px;box-shadow:var(--shadow-s);cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.ch-card:hover{border-color:#B9D2F5;box-shadow:var(--shadow-m);transform:translateY(-2px)}
.ch-card:hover .go{opacity:1;transform:translateX(0)}
.ch-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.ch-card h3{font-size:14px;margin-bottom:3px}
.ch-card p{font-size:12px;color:var(--ink-3);line-height:1.45;min-height:34px}
.ch-meta{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line-2)}
.ch-meta .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
.ch-meta .l{font-size:11px;color:var(--ink-4)}
.go{margin-left:auto;color:var(--blue);opacity:0;transform:translateX(-4px);transition:.16s}

/* stepper */
.steps{display:flex;align-items:center;gap:0;margin-bottom:22px}
.step{display:flex;align-items:center;gap:9px;flex:1}
.step .n{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex-shrink:0;
  background:#fff;border:1.5px solid var(--line);color:var(--ink-4)
}
.step.on .n{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-lt)}
.step.dn .n{background:var(--green);border-color:var(--green);color:#fff}
.step .t{font-size:12px;font-weight:600;color:var(--ink-4);white-space:nowrap}
.step.on .t{color:var(--ink)} .step.dn .t{color:var(--ink-2)}
.step .ln{flex:1;height:1.5px;background:var(--line);margin:0 10px;min-width:14px}
.step.dn .ln{background:var(--green)}
.step:last-child{flex:0}
.step:last-child .ln{display:none}

/* OTP */
.otp{display:flex;gap:9px;justify-content:center;margin:6px 0 4px}
.otp input{
  width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;background:#fff;font-family:var(--mono)
}
.otp input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.otp input.ok{border-color:var(--green);background:var(--green-lt)}

/* signature pad */
.sig{
  height:110px;border:1.5px dashed #C6D8F2;border-radius:11px;background:#FBFDFF;
  display:grid;place-items:center;cursor:crosshair;position:relative;overflow:hidden
}
.sig canvas{position:absolute;inset:0;width:100%;height:100%}
.sig .ph{color:var(--ink-4);font-size:12.5px;pointer-events:none;text-align:center}

/* receipt */
.receipt{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  box-shadow:var(--shadow-m);max-width:520px;margin:0 auto
}
.receipt-top{background:linear-gradient(150deg,#0A1B33,#1B5FD1);color:#fff;padding:20px;text-align:center;position:relative}
.receipt-top h2{color:#fff;font-size:16px}
.receipt-top p{font-size:12px;color:#B6CDEE;margin-top:3px}
.rcpt-seal{
  width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);
  display:grid;place-items:center;margin:0 auto 11px;
}
.perf{height:12px;background:
  radial-gradient(circle at 6px 6px, transparent 5px, #fff 5px) repeat-x;
  background-size:12px 12px;background-color:#0A1B33;margin-top:-1px}
.receipt-b{padding:18px 22px}
.receipt-f{padding:13px 22px;background:#FAFCFE;border-top:1px dashed var(--line);display:flex;gap:9px}

/* validation console */
.console{background:#0A1B33;border-radius:var(--r-l);padding:16px;font-family:var(--mono);font-size:12px;color:#8FB4E8;min-height:180px;overflow:auto;max-height:340px}
.console .ln{padding:3px 0;display:flex;gap:9px;animation:fadeUp .3s ease}
.console .tm{color:#4C6E9E;flex-shrink:0}
.console .ok{color:#3EDB9D} .console .er{color:#FF7C8F} .console .wr{color:#FFC86B} .console .in{color:#9FD0FF}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* decision */
.decision{border-radius:var(--r-l);padding:22px;text-align:center;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.d-allow{background:linear-gradient(160deg,var(--green-lt),#F4FDF9);border:1.5px solid #9DE3C6}
.d-block{background:linear-gradient(160deg,var(--red-lt),#FEF7F8);border:1.5px solid #F5B8C1}
.d-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
.d-allow .d-ic{background:var(--green);color:#fff;box-shadow:0 0 0 8px rgba(14,166,114,.14)}
.d-block .d-ic{background:var(--red);color:#fff;box-shadow:0 0 0 8px rgba(220,43,69,.12)}
.decision h2{font-size:20px;letter-spacing:-.03em}
.d-allow h2{color:#0A7D56} .d-block h2{color:#B21F36}
.decision .why{font-size:13px;margin-top:6px}
.d-allow .why{color:#0A7D56} .d-block .why{color:#B21F36}

/* flow diagram */
.flow{display:flex;flex-direction:column;gap:0;align-items:center}
.flow-n{
  width:100%;max-width:400px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:11px;transition:.35s;box-shadow:var(--shadow-s)
}
.flow-n.act{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-lt),var(--shadow-m);transform:scale(1.02)}
.flow-n.ok{border-color:var(--green);background:#F7FDFB}
.flow-n.bad{border-color:var(--red);background:#FFF8F9}
.flow-n .fi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:var(--bg);color:var(--ink-3)}
.flow-n.act .fi{background:var(--blue-lt);color:var(--blue)}
.flow-n.ok .fi{background:var(--green-lt);color:var(--green)}
.flow-n.bad .fi{background:var(--red-lt);color:var(--red)}
.flow-n .ft{font-size:13px;font-weight:600;color:var(--ink)}
.flow-n .fs{font-size:11.5px;color:var(--ink-4);margin-top:1px}
.flow-n .fb{margin-left:auto}
.flow-a{width:2px;height:18px;background:var(--line);position:relative}
.flow-a.done{background:var(--green)}
.flow-a::after{content:'';position:absolute;bottom:-1px;left:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--line)}
.flow-a.done::after{border-top-color:var(--green)}

/* connector card */
.conn{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow-s);cursor:pointer;transition:.16s}
.conn:hover{border-color:#B9D2F5;box-shadow:var(--shadow-m);transform:translateY(-2px)}
.conn-t{display:flex;align-items:flex-start;gap:11px;margin-bottom:13px}
.conn-lg{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:13px}
.conn h3{font-size:13.5px} .conn .sys{font-size:11.5px;color:var(--ink-4);margin-top:1px}
.conn-m{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:12px;border-top:1px solid var(--line-2)}
.conn-m .l{font-size:10px;color:var(--ink-4);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.conn-m .v{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
.health{display:flex;gap:2px;align-items:flex-end;height:16px}
.health i{width:3px;border-radius:2px;background:var(--green);display:block}

/* modal + drawer */
.ovl{position:fixed;inset:0;background:rgba(10,27,51,.45);backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:24px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-l);width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:pop .24s cubic-bezier(.34,1.4,.64,1)}
.modal.wide{max-width:760px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-b{padding:22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;background:#FAFCFE;border-radius:0 0 var(--r-xl) var(--r-xl)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:#fff;box-shadow:var(--shadow-l);z-index:81;overflow-y:auto;animation:slideIn .26s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.menu{
  position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow-l);min-width:270px;z-index:70;overflow:hidden;animation:pop .16s
}
.menu-h{padding:11px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px}
.menu-i{display:flex;gap:10px;padding:9px 14px;width:100%;text-align:left;align-items:flex-start;transition:.1s}
.menu-i:hover{background:var(--bg)}
.menu-i .t{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4}
.menu-i .m{font-size:11px;color:var(--ink-4);margin-top:1px}
.menu-f{padding:8px 14px;border-top:1px solid var(--line-2);background:#FAFCFE}
.hdr-r{position:relative;display:flex;align-items:center;gap:4px}

/* toasts */
.toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:9px}
.toast{
  background:#0A1B33;color:#fff;border-radius:11px;padding:12px 15px;box-shadow:var(--shadow-l);
  display:flex;gap:10px;align-items:center;min-width:280px;max-width:400px;animation:slideUp .26s cubic-bezier(.2,.8,.3,1)
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast .t{font-size:13px;font-weight:600} .toast .m{font-size:11.5px;color:#9DB4D4;margin-top:1px}
.toast .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}

/* command palette */
.cmdk{position:fixed;inset:0;background:rgba(10,27,51,.4);backdrop-filter:blur(3px);z-index:90;padding-top:12vh;display:flex;justify-content:center;animation:fade .15s}
.cmd-box{width:100%;max-width:600px;background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-l);overflow:hidden;height:fit-content;max-height:66vh;display:flex;flex-direction:column;animation:pop .2s}
.cmd-in{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.cmd-in input{flex:1;border:none;outline:none;font-size:15px;color:var(--ink)}
.cmd-res{overflow-y:auto;padding:7px}
.cmd-sec{font-size:10px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;padding:9px 11px 5px}
.cmd-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;width:100%;text-align:left}
.cmd-i:hover,.cmd-i.sel{background:var(--blue-lt)}
.cmd-i .ic{width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--ink-3);flex-shrink:0}
.cmd-i:hover .ic,.cmd-i.sel .ic{background:#fff;color:var(--blue)}
.cmd-i .t{font-size:13px;font-weight:500;color:var(--ink)} .cmd-i .m{font-size:11px;color:var(--ink-4)}

/* charts */
.donut-lg{display:flex;flex-direction:column;gap:7px;flex:1}
.dl{display:flex;align-items:center;gap:8px;font-size:12px}
.dl .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.dl .n{color:var(--ink-2);font-weight:500}
.dl .v{margin-left:auto;font-weight:700;color:var(--ink);font-family:var(--mono);font-size:11.5px}
.chart-t{fill:var(--ink-4);font-size:10px;font-weight:600;font-family:var(--sans)}

/* code */
pre.code{background:#0A1B33;color:#9FD0FF;border-radius:11px;padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto}
pre.code .k{color:#7FDBB6} .code .s{color:#FFC86B} .code .c{color:#4C6E9E}

.hide{display:none !important}
.mt{margin-top:16px} .mb{margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap}
.sp{justify-content:space-between} .col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-3)} .faint{color:var(--ink-4)} .sm{font-size:12px} .xs{font-size:11px}
.b6{font-weight:600} .b7{font-weight:700} .tar{text-align:right} .tac{text-align:center}
.nowrap{white-space:nowrap}

@media(max-width:1240px){
  .g4,.g5{grid-template-columns:repeat(2,1fr)}
  .g-2-1,.g-1-2,.g-3-2,.g3{grid-template-columns:1fr}
}
@media(max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:.2s;width:248px}
  .nav.open{transform:none;box-shadow:var(--shadow-l)}
  .main{padding:16px}
  .g2,.g4,.g5{grid-template-columns:1fr}
  .brand{width:auto} .gsearch{max-width:none} .hdr-pulse{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ===== Consent Drives ===== */
.lnk{color:var(--blue);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
td.num,th.num{text-align:right}
.mini-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-right:7px}
.mini-bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.mini-bar.lg{width:100%;height:7px;margin:8px 0 0}
.perf-tile{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff}
.perf-tile .pv{font-size:26px;font-weight:750;letter-spacing:-.6px;margin-top:6px;line-height:1}
/* ================= MOTION & MICRO-INTERACTIONS ================= */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* view transition on every route change */
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view>*{animation:viewIn .32s cubic-bezier(.2,.7,.3,1) both}
#view>*:nth-child(2){animation-delay:.04s}
#view>*:nth-child(3){animation-delay:.08s}
#view>*:nth-child(4){animation-delay:.12s}
#view>*:nth-child(5){animation-delay:.15s}
#view>*:nth-child(n+6){animation-delay:.18s}

/* staggered reveal for lists and grids */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stg>*{animation:riseIn .42s cubic-bezier(.2,.7,.3,1) both}
.stg>*:nth-child(1){animation-delay:.03s}.stg>*:nth-child(2){animation-delay:.08s}
.stg>*:nth-child(3){animation-delay:.13s}.stg>*:nth-child(4){animation-delay:.18s}
.stg>*:nth-child(5){animation-delay:.23s}.stg>*:nth-child(6){animation-delay:.28s}
.stg>*:nth-child(7){animation-delay:.33s}.stg>*:nth-child(n+8){animation-delay:.38s}

/* cards that go somewhere lift; static cards don't */
.card,.kpi{transition:box-shadow .2s cubic-bezier(.2,.7,.3,1),transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s}
.kpi.clickable:hover,.card.tapable:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(11,37,69,.11);border-color:#CBDCF3}
.kpi.clickable:active,.card.tapable:active{transform:translateY(0);transition-duration:.06s}

/* nav */
.nav-item{transition:background .15s,color .15s,padding-left .16s cubic-bezier(.2,.7,.3,1)}
.nav-item:hover:not(.on){padding-left:13px;background:var(--bg)}

/* buttons */
.btn{transition:background .16s,border-color .16s,transform .12s,box-shadow .16s}
.btn:active{transform:scale(.975)}
.btn-p:hover{box-shadow:0 5px 16px rgba(11,37,69,.22)}

/* rows */
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--bg)}

/* live dot */
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(14,166,114,.5)}70%{box-shadow:0 0 0 7px rgba(14,166,114,0)}100%{box-shadow:0 0 0 0 rgba(14,166,114,0)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:livePulse 2.1s infinite}

/* number count-up sits on its own line so layout never jumps */
.cnum{font-variant-numeric:tabular-nums}

/* ===== people feed (dashboard) ===== */
.feed{display:flex;flex-direction:column;gap:9px}
.fitem{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px;transition:border-color .18s,transform .18s,box-shadow .18s;cursor:pointer}
.fitem:hover{border-color:#CBDCF3;transform:translateX(3px);box-shadow:0 6px 20px rgba(11,37,69,.08)}
.fav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.ftxt{font-size:13.5px;line-height:1.5;color:var(--ink)}
.ftxt b{font-weight:650}
.fmeta{font-size:11px;color:var(--ink-4);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ftag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--ink-3)}
.ftag.g{background:var(--green-lt);color:var(--green)}
.ftag.r{background:var(--red-lt);color:var(--red)}
.ftag.a{background:var(--amber-lt);color:var(--amber)}
.ftag.v{background:var(--violet-lt);color:var(--violet)}

/* quiet number strip */
.strip{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.strip>div{flex:1;min-width:130px;padding:12px 15px;border-right:1px solid var(--line-2);transition:background .16s;cursor:pointer}
.strip>div:last-child{border-right:none}
.strip>div:hover{background:var(--bg)}
.strip .sv{font-size:19px;font-weight:750;letter-spacing:-.5px;line-height:1}
.strip .sl{font-size:10.5px;color:var(--ink-4);margin-top:3px}

/* plain-language line above a chart */
.plain{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:12px}
.plain b{color:var(--ink);font-weight:650}

/* ===== radial fan-out map ===== */
.radial{position:relative}
.radial svg{width:100%;height:auto;display:block;overflow:visible}
.rspoke{stroke:var(--line);stroke-width:2;transition:stroke .3s}
.rspoke.on{stroke:var(--blue)}
.rspoke.ok{stroke:var(--green)}
.rspoke.bad{stroke:var(--red)}
.rflow{stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .55s cubic-bezier(.3,.8,.4,1)}
.rflow.go{stroke-dashoffset:0}
.rnode circle{transition:fill .3s,stroke .3s,r .3s cubic-bezier(.2,.7,.3,1)}
.rnode text{font-size:9.5px;font-weight:650;fill:var(--ink-2)}
.rnode .sub{font-size:8px;font-weight:500;fill:var(--ink-4)}
.rnode.hit circle{r:21}
@keyframes hubBeat{0%,100%{r:30}50%{r:34}}
.rhub.fire circle.core{animation:hubBeat .85s ease-in-out infinite}
@keyframes ring{from{r:30;opacity:.55}to{r:78;opacity:0}}
.rhub.fire circle.ring{animation:ring 1.5s ease-out infinite}
.rnode{cursor:pointer}
.rnode:hover circle.n{stroke-width:3}

/* ===== permission grid ===== */
.pgwrap{overflow-x:auto}
table.pg{border-collapse:separate;border-spacing:3px;font-size:11px}
table.pg th.sysh{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:650;color:var(--ink-2);padding:7px 3px;white-space:nowrap;vertical-align:bottom;text-align:left;height:96px}
table.pg th.sysh .vd{font-weight:500;color:var(--ink-4);font-size:9px}
table.pg th.purh{text-align:left;font-size:11.5px;font-weight:650;color:var(--ink);padding:0 12px 0 2px;white-space:nowrap;min-width:148px}
table.pg th.purh .lg{display:block;font-size:9.5px;color:var(--ink-4);font-weight:500;margin-top:1px}
@keyframes cellIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.pcell{width:50px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;border:1.5px solid transparent;font-size:13px;font-weight:800;
  transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;animation:cellIn .3s cubic-bezier(.2,.7,.3,1) both}
.pcell:hover{transform:scale(1.14);box-shadow:0 5px 16px rgba(11,37,69,.16);z-index:4}
.pcell.sel{border-color:var(--navy);transform:scale(1.1)}
.pcell.a{background:var(--green-lt);color:var(--green)}
.pcell.b{background:var(--red-lt);color:var(--red)}
.pcell.r{background:var(--amber-lt);color:var(--amber)}
.pcell.n{background:var(--line-2);color:#C3CBD6}
@keyframes flipRed{0%{background:var(--green-lt);color:var(--green);transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{background:var(--red-lt);color:var(--red);transform:rotateY(0)}}
.pcell.flip{animation:flipRed .6s cubic-bezier(.4,0,.2,1) both}
.pglegend{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--ink-3)}
.pglegend span{display:flex;align-items:center;gap:6px}
.pglegend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.pgdetail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;min-height:180px}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:750;padding:7px 13px;border-radius:9px;margin-bottom:11px}
.verdict.a{background:var(--green-lt);color:var(--green)}
.verdict.b{background:var(--red-lt);color:var(--red)}
.verdict.r{background:var(--amber-lt);color:var(--amber)}
.verdict.n{background:var(--line-2);color:var(--ink-3)}
.pgreason{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:9px}

/* ===== lifespan ribbon ===== */
.ribbon{position:relative;padding-left:132px;margin-bottom:7px;height:26px}
.ribbon .rlab{position:absolute;left:0;top:4px;width:126px;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrack{position:relative;height:100%;background:var(--line-2);border-radius:6px;overflow:hidden}
@keyframes growW{from{width:0}}
.rseg{position:absolute;top:0;bottom:0;border-radius:6px;animation:growW .7s cubic-bezier(.2,.7,.3,1) both;transition:filter .16s}
.rseg:hover{filter:brightness(1.08)}
.rseg.act{background:linear-gradient(90deg,#0EA672,#3DBE8E)}
.rseg.wd{background:repeating-linear-gradient(45deg,#DC2B45,#DC2B45 5px,#c42440 5px,#c42440 10px)}
.rseg.exp{background:repeating-linear-gradient(45deg,#C8860D,#C8860D 5px,#b07a0c 5px,#b07a0c 10px)}
.rscale{display:flex;justify-content:space-between;padding-left:132px;font-size:10px;color:var(--ink-4);margin-top:3px}
</style>

/* ================= CHART ENGINE (hand-rolled SVG) ================= */
function areaChart(data,{w=700,h=190,c='#1B5FD1',c2='#0EA672',labels=[],series2=null}={}){
  const pad={l:34,r:8,t:12,b:22};
  const max=Math.max(...data,...(series2||[0]))*1.18;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=>pad.l+(i/(data.length-1))*iw, Y=v=>pad.t+ih-(v/max)*ih;
  const line=d=>d.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area=d=>line(d)+` L${X(d.length-1).toFixed(1)},${pad.t+ih} L${pad.l},${pad.t+ih} Z`;
  const gy=[0,.25,.5,.75,1].map(f=>{const v=max*f;return `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EFF3F9" stroke-width="1"/><text class="chart-t" x="${pad.l-7}" y="${Y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}).join('');
  const xl=labels.map((l,i)=>l?`<text class="chart-t" x="${X(i)}" y="${h-5}" text-anchor="middle">${l}</text>`:'').join('');
  const pts=data.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="8" fill="transparent"><title>${labels[i]||''}: ${v} consents</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${gy}${xl}
    ${series2?`<path d="${line(series2)}" fill="none" stroke="${c2}" stroke-width="2" stroke-dasharray="4 3" opacity=".85"/>`:''}
    <path d="${area(data)}" fill="url(#ag)"/>
    <path d="${line(data)}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/>
    ${pts}
  </svg>`;
}
function donut(items,{size=168,thick=22,center=''}={}){
  const tot=items.reduce((s,i)=>s+i.v,0);
  const r=(size-thick)/2, C=2*Math.PI*r; let off=0;
  const arcs=items.map(i=>{
    const f=i.v/tot, len=f*C;
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${i.c}" stroke-width="${thick}"
      stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt">
      <title>${i.n}: ${nf(i.v)} (${(f*100).toFixed(1)}%)</title></circle>`;
    off+=len; return s;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F1F5F9" stroke-width="${thick}"/>
    ${arcs}
    <text x="${size/2}" y="${size/2-2}" text-anchor="middle" style="font:700 20px var(--sans);fill:var(--ink)">${center||nf(tot)}</text>
    <text x="${size/2}" y="${size/2+15}" text-anchor="middle" style="font:600 10px var(--sans);fill:var(--ink-4);letter-spacing:.06em">TOTAL</text>
  </svg>`;
}
function gauge(score,size=150){
  const r=62,C=Math.PI*r, f=score/100;
  return `<svg viewBox="0 0 ${size} ${size*0.62}" style="width:${size}px">
    <path d="M13 ${size*0.55} A${r} ${r} 0 0 1 ${size-13} ${size*0.55}" fill="none" stroke="#EFF3F9" stroke-width="11" stroke-linecap="round"/>
    <path d="M13 ${size*0.55} A${r} ${r} 0 0 1 ${size-13} ${size*0.55}" fill="none" stroke="url(#gg)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${(C*f).toFixed(1)} ${C}"/>
    <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0%" stop-color="#1B5FD1"/><stop offset="100%" stop-color="#0EA672"/></linearGradient></defs>
    <text x="${size/2}" y="${size*0.48}" text-anchor="middle" style="font:700 26px var(--sans);fill:var(--ink)">${score}</text>
    <text x="${size/2}" y="${size*0.6}" text-anchor="middle" style="font:600 10px var(--sans);fill:var(--ink-4)">OUT OF 100</text>
  </svg>`;
}
function spark(data,{w=90,h=32,c='#1B5FD1'}={}){
  const mx=Math.max(...data),mn=Math.min(...data);
  const p=data.map((v,i)=>`${i?'L':'M'}${(i/(data.length-1)*w).toFixed(1)},${(h-((v-mn)/(mx-mn||1))*(h-6)-3).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}"><path d="${p}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function togglePurpose(pid,ch){
  const p=PURPOSES.find(x=>x.id===pid); if(p.mandatory) return;
  W.purposes.includes(pid) ? W.purposes=W.purposes.filter(x=>x!==pid) : W.purposes.push(pid);
  renderWiz(ch);
}
function otpIn(i,ch){
  const el=$('#o'+i); el.value=el.value.replace(/\D/g,'');
  if(el.value){ el.classList.add('ok'); const n=$('#o'+(i+1)); if(n)n.focus(); }
  const code=[0,1,2,3,4,5].map(k=>$('#o'+k).value).join('');
  if(code.length===6){ W.otp=code; setTimeout(()=>{toast('OTP verified','Identity confirmed');W.step=4;renderWiz(ch)},380); }
}
function autoOtp(ch){
  '482913'.split('').forEach((d,i)=>{const el=$('#o'+i); if(el){el.value=d;el.classList.add('ok')}});
  W.otp='482913';
  setTimeout(()=>{toast('OTP verified','Identity confirmed');W.step=4;renderWiz(ch)},480);
}
function signIt(ch){
  W.signed=true;
  const ph=$('#sigph');
  if(ph) ph.innerHTML=`<svg width="150" height="52" viewBox="0 0 150 52"><path d="M8 38c14-6 16-26 24-26s4 24 12 24 10-20 18-20 6 18 14 18 12-16 22-16 14 8 22 8" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round"/></svg><div class="xs" style="color:var(--green);font-weight:600;margin-top:4px">Signed by ${esc(W.cust.name)}</div>`;
  toast('Signed','Signature captured as evidence');
  renderWizAfterSign(ch);
}
function renderWizAfterSign(ch){
  const btn=document.querySelector('#wiz .btn-g'); if(btn) btn.disabled=false;

}
function submitConsent(id){
  const ch=chById[id], c=W.cust;
  const rec={
    id:'CNS-2026-'+String(15000+Math.floor(Math.random()*900)), cid:c.id, cname:c.name,
    purpose:W.purposes[0], pname:PURPOSES.find(p=>p.id===W.purposes[0]).name,
    channel:id, chname:ch.name, status:'Active', lang:W.lang, captured:new Date(),
    expires:new Date(Date.now()+365*DAY), version:'v4.2', receipt:'RCPT-'+ri(100000,999999),
    hash:'0x'+Array.from({length:12},()=>'0123456789abcdef'[ri(0,15)]).join(''),
    ip:'103.21.'+ri(0,255)+'.'+ri(1,254),
    evidence:(id==='branch'||id==='web'||id==='partner')?'OTP + Digital signature':id==='mobile'?'Biometric + OTP':'OTP verified',
    withdrawnAt:null, fresh:true,
  };
  CONSENTS.unshift(rec); consById[rec.id]=rec; (byCust[c.id]=byCust[c.id]||[]).unshift(rec);
  AUDIT.unshift({id:'AUD-'+ri(700000,799999),act:'Consent captured',actor:'system@consentia',subj:c.name,cid:c.id,at:new Date(),ip:rec.ip,hash:'sha256:'+rec.hash.slice(2),result:'Success'});
  W.rec=rec; W.step=5;
  toast('Consent recorded',rec.id+' · receipt issued');
  renderWiz(id);
}

function repoFiltered(){

  return CONSENTS.filter(c=>
    (!q||c.cname.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)||c.cid.toLowerCase().includes(q)) &&
    (!R.status||c.status===R.status) && (!R.purpose||c.purpose===R.purpose) && (!R.channel||c.channel===R.channel));
}
function repoTable(){
  const all=repoFiltered(), tot=all.length, pages=Math.max(1,Math.ceil(tot/R.per));

function runBreach(id){
  const b=BREACHES.find(x=>x.id===id);
  const btn=$('#brBtn'); btn.disabled=true; btn.innerHTML=IC.clock(15)+' Running…';
  const log=$('#brLog'); log.innerHTML='';
  const lg=(k,t)=>{log.innerHTML+=`<div class="ln"><span class="tm">${fmtT(new Date())}</span><span class="${k}">${esc(t)}</span></div>`;log.scrollTop=log.scrollHeight};
  const acts=[
    ['ok','breach declared · severity '+b.sev+' · owner '+b.owner],
    ['in','scoping from evidence vault · querying processing records…'],
    ['ok',nf(b.affected)+' data principals identified · '+nf(Math.round(b.affected*0.97))+' contactable'],
    ['ok','containment verified · bucket policy corrected · access revoked'],
    ['in','drafting notification · plain language · 9 languages'],
    ['ok',nf(Math.round(b.affected*0.97))+' notifications dispatched · SMS, email, in-app'],
    ['in','assembling Board report from audit trail (1,284,110 events)'],
    ['ok','report assembled · awaiting human sign-off before submission'],
    ['ok','register updated · remediation tracked · evidence sealed'],
  ];
  acts.forEach((a,i)=>setTimeout(()=>{
    lg(a[0],a[1]);
    const stepFor=[0,1,1,2,3,3,4,4,5][i];
    const el=$('#bs'+stepFor);
    if(el){el.classList.add('dn'); el.querySelector('.bi').innerHTML=IC.check(15); $('#bsx'+stepFor).innerHTML='<span class="bdg b-green">Done</span>';}
    $('#brHint').textContent='Step '+(stepFor+1)+' of 6';
    if(i===acts.length-1){
      btn.disabled=false; btn.innerHTML=IC.check(15)+' Response complete';
      b.st='Contained'; b.princ='Notified';
      $('#brHint').textContent='Awaiting sign-off on the Board report';
      toast('Response complete',nf(Math.round(b.affected*0.97))+' notified · Board report awaiting sign-off','warn');
      setTimeout(()=>modal('Sign off the Board report?',`
        <div class="note n-amber mb">${IC.alert(15)}<div>The report is assembled from the audit trail and is ready to file. <b>A human signs this, not a machine.</b> Once submitted it cannot be withdrawn.</div></div>

.pc-right-item .rt .n{font-size:12.5px;font-weight:640;color:var(--ink)}
.pc-right-item .rt .d{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.pc-receipt{padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.pc-receipt .rr{display:flex;justify-content:space-between;align-items:center}
.pc-receipt .rn{font-size:12px;font-weight:640;color:var(--ink)}
.pc-receipt .rd{font-size:10.5px;color:var(--ink-4);margin-top:2px}

.cust-panel .cp-sec{margin-bottom:22px}
.cust-panel h3{font-size:13px;font-weight:680;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:9px;cursor:pointer;border:2.5px solid transparent;transition:.15s;position:relative}
.swatch.on{border-color:var(--ink);transform:scale(1.06)}
.swatch.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.lang-seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.lang-seg button{padding:7px 14px;border:none;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);border-radius:7px;cursor:pointer}
.lang-seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow-s)}
.pc-purp-toggle{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
.pc-purp-toggle .pt2{flex:1;font-size:12.5px;font-weight:560;color:var(--ink)}
</style>

<script>
/* ================= MODULE 14 · WORKFLOW BUILDER ================= */
const WF_LIB={
  triggers:[
    {k:'tg',ic:'x',key:'trg_withdraw',t:'Consent is withdrawn',s:'A customer opts out of a purpose'},
    {k:'tg',ic:'check',key:'trg_capture',t:'Consent is captured',s:'A new consent is recorded'},
    {k:'tg',ic:'clock',key:'trg_expire',t:'Consent is expiring',s:'30 days before it lapses'},
    {k:'tg',ic:'user',key:'trg_dsr',t:'A rights request is raised',s:'Access, erasure, correction…'},
    {k:'tg',ic:'vendor',key:'trg_dpa',t:'A vendor DPA expires',s:'A processor contract lapses'},
    {k:'tg',ic:'shield',key:'trg_minor',t:'A minor is detected',s:'Age assurance flags an account'},
  ],
  conditions:[
    {k:'cn',ic:'filter',key:'cnd_purpose',t:'If purpose is…',s:'Branch on the consent purpose'},
    {k:'cn',ic:'user',key:'cnd_minor',t:'If customer is a minor',s:'Apply child-safety rules'},
    {k:'cn',ic:'globe',key:'cnd_region',t:'If region is…',s:'Branch on customer location'},
  ],
  actions:[
    {k:'ac',ic:'mega',key:'act_suppress',t:'Suppress in a system',s:'Stop using the data there'},
    {k:'ac',ic:'crm',key:'act_crm',t:'Update CRM flag',s:'Set the permission field'},
    {k:'ac',ic:'vendor',key:'act_notify',t:'Notify processors',s:'Tell third parties to stop'},
    {k:'ac',ic:'sms',key:'act_sms',t:'Remove from SMS/email',s:'Add to the suppression list'},
    {k:'ac',ic:'file',key:'act_receipt',t:'Issue a receipt',s:'Send proof to the customer'},
    {k:'ac',ic:'audit',key:'act_audit',t:'Write to audit log',s:'Immutable, hash-chained'},
    {k:'ac',ic:'clock',key:'act_wait',t:'Wait',s:'Pause before the next step'},
    {k:'ac',ic:'send',key:'act_reconsent',t:'Send re-consent notice',s:'Ask the customer again'},
    {k:'ac',ic:'alert',key:'act_escalate',t:'Escalate to the DPO',s:'Flag for human review'},
  ]
};
const WF_ALL=[...WF_LIB.triggers,...WF_LIB.conditions,...WF_LIB.actions];
const wfByKey=Object.fromEntries(WF_ALL.map(x=>[x.key,x]));

const WF_TEMPLATES=[
  {name:'Withdrawal → suppress everywhere', ic:'x', col:'red',
   steps:['trg_withdraw','cnd_purpose','act_suppress','act_sms','act_notify','act_crm','act_receipt','act_audit']},
  {name:'New consent → unlock systems', ic:'check', col:'green',
   steps:['trg_capture','act_crm','act_receipt','act_audit']},
  {name:'Consent expiring → re-consent', ic:'clock', col:'amber',
   steps:['trg_expire','act_reconsent','act_wait','act_escalate']},
  {name:'DPA expired → block vendor', ic:'vendor', col:'violet',
   steps:['trg_dpa','act_notify','act_escalate','act_audit']},
  {name:'Erasure request → fan-out & prove', ic:'trash', col:'blue',
   steps:['trg_dsr','act_suppress','act_notify','act_receipt','act_audit']},
  {name:'Minor detected → block bad purposes', ic:'shield', col:'red',
   steps:['trg_minor','cnd_minor','act_suppress','act_audit']},
];

let WF=[]; let WF_TITLE='Withdrawal → suppress everywhere'; let WF_ACTIVE=true;
function loadTemplate(i){
  const t=WF_TEMPLATES[i]; WF=t.steps.map(k=>({...wfByKey[k]})); WF_TITLE=t.name; WF_ACTIVE=true;
  if($('#wfCanvas')) renderWF(); toast('Template loaded',t.name);
}
function vWorkflow(){
  if(!WF.length) loadTemplate(0);
  V().innerHTML=`
  <div class="crumb"><b>Automation</b> ${IC.arrow(11)} Workflow Builder</div>
  <div class="page-head">
    <div><h1>Workflow builder</h1>
      <div class="sub">Drag the pieces together and the platform does the rest. When a customer changes their mind, this is the recipe that makes every system obey — no code, no tickets, no one forgetting a step.</div></div>
    <div class="acts">
      <button class="btn btn-o" onclick="testWF()">${IC.play(15)} Test run</button>
      <button class="btn btn-p" onclick="toast('Workflow published','Live across 8 systems')">${IC.check(15)} Publish</button>
    </div>
  </div>

  <div class="grid g4 mb">
    ${kpi('Active workflows','6','Running across the estate','flat','blue','link',[6,6,6,6,6,6,6,6])}
    ${kpi('Runs this week','5,412','Every one acknowledged or queued','up','green','bolt',[380,412,405,448,432,470,461,502])}
    ${kpi('Steps automated','38','That nobody does by hand','flat','violet','check',[30,32,34,35,36,37,38,38])}
    ${kpi('Avg. build time','4 min','From idea to live','up','amber','clock',[12,10,8,7,6,5,4,4])}
  </div>

  <div class="card mb">
    <div class="card-h"><div><h2>Start from a template</h2><div class="hint">Or build your own on the canvas below</div></div></div>
    <div class="card-b">
      <div class="wf-tpl">
        ${WF_TEMPLATES.map((t,i)=>`<div class="tpl-card" onclick="loadTemplate(${i})">
          <div class="th"><div class="ti" style="background:var(--${t.col}-lt);color:var(--${t.col})">${IC[t.ic](15)}</div></div>
          <div class="tn">${t.name}</div>
          <div class="td">${t.steps.length} steps · auto-runs on trigger</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="wf-layout">
    <div class="wf-pal">
      <h4>${IC.bolt(11)} Triggers</h4>
      ${WF_LIB.triggers.map(x=>palItem(x)).join('')}
      <h4>${IC.filter(11)} Conditions</h4>
      ${WF_LIB.conditions.map(x=>palItem(x)).join('')}
      <h4>${IC.check(11)} Actions</h4>
      ${WF_LIB.actions.map(x=>palItem(x)).join('')}
    </div>
    <div>
      <div class="wf-toolbar">
        <input class="wf-name" value="${esc(WF_TITLE)}" onchange="WF_TITLE=this.value">
        <span class="bdg ${WF_ACTIVE?'b-green':'b-gray'}" id="wfState">${WF_ACTIVE?'Active':'Paused'}</span>
        <div style="margin-left:auto" class="row" style="gap:8px">
          <button class="btn btn-t btn-sm" onclick="WF_ACTIVE=!WF_ACTIVE;renderWF();toast(WF_ACTIVE?'Workflow activated':'Workflow paused','${''}',WF_ACTIVE?'ok':'warn')">${IC.refresh(13)} Toggle</button>
          <span class="hint">Click any step to configure · hover to delete</span>
        </div>
      </div>
      <div class="wf-canvas"><div class="wf-flow" id="wfCanvas"></div></div>
    </div>
  </div>`;
  renderWF();
}
function palItem(x){
  return `<div class="pal-item ${x.k}" onclick="addStep('${x.key}')">
    <div class="pi">${IC[x.ic](14)}</div><div class="pt">${x.t}</div>
  </div>`;
}
function renderWF(){
  const el=$('#wfCanvas'); if(!el) return;
  const st=$('#wfState'); if(st){st.className='bdg '+(WF_ACTIVE?'b-green':'b-gray');st.textContent=WF_ACTIVE?'Active':'Paused';}
  let h='';
  WF.forEach((n,i)=>{
    const role=n.k==='tg'?'WHEN':n.k==='cn'?'ONLY IF':'THEN';
    h+=`<div class="wf-node ${n.k}" id="wfn${i}">
      <div class="wf-card" onclick="cfgStep(${i})">
        <div class="wf-ic">${IC[n.ic](17)}</div>
        <div class="wf-tt"><div class="k">${role}</div><div class="t">${n.t}</div><div class="s">${n.s}</div></div>
        ${i>0?`<div class="wf-del" onclick="event.stopPropagation();delStep(${i})">${IC.x(13)}</div>`:''}
      </div></div>`;
    if(i<WF.length-1) h+=`<div class="wf-conn"></div><div class="wf-add" onclick="insertAt(${i+1})">+</div><div class="wf-conn"></div>`;
  });
  h+=`<div class="wf-conn"></div><div class="wf-add" onclick="insertAt(${WF.length})" title="Add a step">+</div>`;
  el.innerHTML=h;
}
function addStep(key){
  const x=wfByKey[key];
  if(x.k==='tg'){ WF[0]={...x}; toast('Trigger set',x.t); }
  else WF.push({...x});
  renderWF();
  if(x.k!=='tg') toast('Step added',x.t);
}
let INSERT_IDX=null;
function insertAt(idx){
  INSERT_IDX=idx;
  modal('Add a step here',`
    <p class="sm muted mb">Pick what happens at this point in the workflow.</p>
    <div class="grid g2" style="gap:8px">
      ${[...WF_LIB.conditions,...WF_LIB.actions].map(x=>`
        <div class="pal-item ${x.k}" style="margin:0" onclick="doInsert('${x.key}')">
          <div class="pi">${IC[x.ic](14)}</div><div class="pt">${x.t}</div>
        </div>`).join('')}
    </div>`,
    `<button class="btn btn-o" onclick="closeLayer()">Cancel</button>`,true);
}
function doInsert(key){
  WF.splice(INSERT_IDX,0,{...wfByKey[key]});
  closeLayer(); renderWF(); toast('Step inserted',wfByKey[key].t);
}
function delStep(i){ const n=WF[i]; WF.splice(i,1); renderWF(); toast('Step removed',n.t,'warn'); }
function cfgStep(i){
  const n=WF[i];
  const role=n.k==='tg'?'Trigger':n.k==='cn'?'Condition':'Action';
  let extra='';
  if(n.key==='cnd_purpose') extra=`<div class="fld"><label>Purpose to match</label><select class="inp">${PURPOSES.map(p=>`<option>${p.name}</option>`).join('')}</select></div>`;
  if(n.key==='act_suppress') extra=`<div class="fld"><label>System to suppress in</label><select class="inp">${SYSTEMS.map(s=>`<option>${s.name}</option>`).join('')}</select></div>`;
  if(n.key==='act_wait') extra=`<div class="fld"><label>Wait for</label><select class="inp"><option>1 hour</option><option>24 hours</option><option>7 days</option></select></div>`;
  if(n.key==='act_notify') extra=`<div class="fld"><label>Notify</label><label class="chk on"><input type="checkbox" checked><div><div class="t">All processors with an active DPA</div></div></label></div>`;
  drawer(role+' · '+n.t,`
    <div class="note ${n.k==='tg'?'n-blue':n.k==='cn'?'n-amber':'n-green'} mb">${IC[n.ic](15)}<div>${n.s}</div></div>
    ${extra||'<p class="sm muted">This step has no extra settings. It runs exactly as described.</p>'}
    <div class="fld" style="margin-top:14px"><label>On failure</label>
      <select class="inp"><option>Retry 3×, then send to the dead-letter queue</option><option>Retry 3×, then stop the workflow</option><option>Skip and continue</option></select></div>`,
    `<button class="btn btn-o" onclick="closeLayer()">Close</button><button class="btn btn-p" onclick="closeLayer();toast('Step saved','${esc(n.t)}')">Save step</button>`);
}
function testWF(){
  if(!WF.length) return;
  toast('Test run started','Simulating with a sample customer');
  WF.forEach((n,i)=>{
    setTimeout(()=>{
      document.querySelectorAll('.wf-node').forEach(x=>x.classList.remove('lit'));
      const el=$('#wfn'+i); if(el){el.classList.add('lit'); el.scrollIntoView({block:'center',behavior:'smooth'});}
      setTimeout(()=>{const e2=$('#wfn'+i);if(e2){e2.classList.remove('lit');e2.classList.add('done');}},560);
      if(i===WF.length-1) setTimeout(()=>{
        toast('Test complete','All '+WF.length+' steps ran · nothing left undone');
        setTimeout(()=>document.querySelectorAll('.wf-node').forEach(x=>x.classList.remove('done')),1800);
      },640);
    },640*(i+1));
  });
}

<script>
/* ================= MODULE · CONSENT DRIVES =================
   Compliance-led consent collection initiatives.
   Deliberately NOT a marketing campaign tool: no budgets, no A/B tests,
   no approval chains, no reminder engine, no segment builder.
   Structured so those can be added later without reshaping the model.

const DRIVE_PURPOSES=['Marketing','Loan Processing','Account Opening','KYC','Third Party Sharing','Service Communication','Other'];
const DRIVE_AUDIENCES=['Existing Customers','Active Customers','New Customers','Loan Customers','Deposit Customers','Credit Card Customers','Custom Upload'];
const DRIVE_CHANNELS=[
  {id:'whatsapp',name:'WhatsApp',ic:'chat'},
  {id:'sms',     name:'SMS',     ic:'sms'},
  {id:'email',   name:'Email',   ic:'mail'},
  {id:'app',     name:'Mobile App',ic:'mobile'},
];
/* status vocabulary — Scheduled | Active | Completed | Cancelled.
   `paused` is a flag on an Active drive so Pause/Resume work without a 5th status. */
const DRIVE_STATUS=['Scheduled','Active','Completed','Cancelled'];

const DRIVES=[];
(function seedDrives(){
  const seed=[
    ['Marketing re-consent — retail book','Marketing','Existing Customers',['whatsapp','sms','email'],'Completed',48200,-96],
    ['Notice v4.2 refresh — active base','Service Communication','Active Customers',['email','app'],'Completed',31450,-72],
    ['Third-party sharing — co-lending partners','Third Party Sharing','Loan Customers',['whatsapp','sms'],'Active',12800,-9],
    ['Credit card cross-sell consent','Marketing','Credit Card Customers',['app','email'],'Active',8640,-5],
    ['Re-KYC consent — dormant accounts','KYC','Existing Customers',['sms','email'],'Active',22100,-14],
    ['Deposit renewal communication','Service Communication','Deposit Customers',['sms','app'],'Completed',15980,-40],
    ['Loan servicing consent — personal loans','Loan Processing','Loan Customers',['whatsapp','app'],'Active',9320,-6],
    ['New onboarding consent — digital savings','Account Opening','New Customers',['app'],'Active',4180,-3],
    ['Analytics & profiling opt-in','Marketing','Active Customers',['email','app'],'Scheduled',26400,4],
    ['Bureau check consent — pre-approved offers','Other','Credit Card Customers',['sms','whatsapp'],'Scheduled',11750,7],
    ['Partner sharing — insurance tie-up','Third Party Sharing','Existing Customers',['email'],'Cancelled',18900,-22],
    ['Branch-assisted re-consent — priority','Marketing','Custom Upload',['sms'],'Completed',6240,-58],
  ];
  seed.forEach((s,i)=>{
    const [name,purpose,aud,chans,status,targeted,dayOffset]=s;
    const start=new Date(NOW.getTime()+dayOffset*DAY);
    let responses=0,approved=0,rejected=0;
    if(status==='Completed'){ responses=Math.round(targeted*(0.52+((i*7)%11)/100)); }
    else if(status==='Active'){ responses=Math.round(targeted*(0.18+((i*5)%14)/100)); }
    else if(status==='Cancelled'){ responses=Math.round(targeted*0.09); }
    if(responses){
      const apRate=0.64+((i*3)%18)/100;
      approved=Math.round(responses*apRate);
      rejected=responses-approved;
    }
    DRIVES.push({
      id:'DRV-'+(2026001+i), name, purpose, audience:aud, channels:chans,
      status, paused:i===6, targeted, responses, approved, rejected,
      start, createdBy:'Ananya Rao (DPO)',
      notice:'v4.2', lang:'9 languages',
    });
  });
})();
const driveById=id=>DRIVES.find(d=>d.id===id);
const dRate=(a,b)=>b?Math.round(a/b*1000)/10:0;
function driveTotals(){
  const t={drives:DRIVES.length,active:0,targeted:0,responses:0,approved:0,rejected:0};
  DRIVES.forEach(d=>{
    if(d.status==='Active') t.active++;
    if(d.status!=='Cancelled'){ t.targeted+=d.targeted; t.responses+=d.responses; t.approved+=d.approved; t.rejected+=d.rejected; }
  });
  return t;
}
function driveBadge(d){
  if(d.status==='Active'&&d.paused) return `<span class="bdg b-amber">Paused</span>`;
  const m={Scheduled:'b-violet',Active:'b-green',Completed:'b-blue',Cancelled:'b-gray'};
  return `<span class="bdg ${m[d.status]}">${d.status}</span>`;
}
function chanChips(ids){
  return ids.map(c=>{const m=DRIVE_CHANNELS.find(x=>x.id===c);return m?`<span class="tag" title="${m.name}">${IC[m.ic](11)} &nbsp;${m.name}</span>`:''}).join('');
}

/* ---------- create-drive form state ---------- */
let DF={name:'',purpose:'',audience:'',channels:[],when:'now',date:'',time:''};
function dfSet(k,v){ DF[k]=v; if(k==='when') renderDriveForm(); dfValidate(); }
function dfChan(id){
  const i=DF.channels.indexOf(id);
  if(i>=0) DF.channels.splice(i,1); else DF.channels.push(id);
  renderDriveForm(); dfValidate();
}
function dfValidate(){
  const ok = DF.name.trim() && DF.purpose && DF.audience && DF.channels.length &&
             (DF.when==='now' || (DF.date && DF.time));
  const b=$('#dfLaunch'); if(b) b.disabled=!ok;
  return ok;
}
function renderDriveForm(){
  const el=$('#driveForm'); if(!el) return;
  el.innerHTML=driveFormHTML();

}
function driveFormHTML(){
  return `
  <div class="grid g3">

            <input type="checkbox" ${DF.channels.includes(c.id)?'checked':''} readonly>

          </label>`).join('')}

    </div>
    <div class="fld"><label>Schedule <span class="req">*</span></label>

  </div>`;
}
function launchDrive(){
  if(!dfValidate()) return;
  const scheduled = DF.when==='later';
  const start = scheduled && DF.date ? new Date(DF.date+'T'+(DF.time||'09:00')) : new Date(NOW);
  const d={
    id:'DRV-'+(2026001+DRIVES.length), name:DF.name.trim(), purpose:DF.purpose, audience:DF.audience,
    channels:DF.channels.slice(), status:scheduled?'Scheduled':'Active', paused:false,
    targeted:ri(2500,30000), responses:0, approved:0, rejected:0,
    start, createdBy:'Ananya Rao (DPO)', notice:'v4.2', lang:'9 languages',
  };
  DRIVES.unshift(d);
  DF={name:'',purpose:'',audience:'',channels:[],when:'now',date:'',time:''};
  vDrives();
  toast(scheduled?'Consent drive scheduled':'Consent drive launched',
        d.name+' · '+nf(d.targeted)+' customers targeted');
}

/* ---------- actions ---------- */
function driveAction(id,act){
  const d=driveById(id); if(!d) return;
  if(act==='pause'){ d.paused=true; toast('Drive paused',d.name+' · no further messages will go out','warn'); }
  if(act==='resume'){ d.paused=false; toast('Drive resumed',d.name+' · sending continues'); }
  if(act==='cancel'){
    modal('Cancel this consent drive?',
      `<p>Cancelling <b>${esc(d.name)}</b> stops all further outreach immediately.</p>
       <div class="note n-blue mt">${IC.info(15)}<div>Consents already collected under this drive stay valid and remain in the repository. Cancelling only stops future sending — it never deletes evidence.</div></div>`,
      `<button class="btn btn-o" onclick="closeLayer()">Keep running</button>
       <button class="btn btn-d" onclick="closeLayer();doCancelDrive('${id}')">Cancel drive</button>`);
    return;
  }
  if(act==='export'){ toast('Export queued',d.id+' · CSV with per-customer responses will be emailed to the DPO'); return; }
  if(act==='edit'){
    if(d.status!=='Scheduled'){ toast('Only scheduled drives can be edited','A running drive can be paused or cancelled','warn'); return; }
    modal('Edit '+esc(d.name),
      `<div class="fld"><label>Drive name</label><input class="inp" id="edName" value="${esc(d.name)}"></div>
       <div class="fld"><label>Start</label><input class="inp" value="${fmtDT(d.start)}" disabled></div>
       <div class="note n-amber mt">${IC.alert(15)}<div>Purpose and audience are fixed once a drive is created — changing them would break the link between a consent and what the customer was actually shown.</div></div>`,
      `<button class="btn btn-o" onclick="closeLayer()">Discard</button>
       <button class="btn btn-p" onclick="d=driveById('${id}');d.name=$('#edName').value||d.name;closeLayer();vDrives();toast('Drive updated','')">Save changes</button>`);
    return;
  }
  vDrives();
}

<script>
/* ================= MODULE · CONSENT HEALTH =================
   Deliberately small: is the consent estate in good shape, and what
   needs attention. One score, four numbers, a breakdown, a short list.
============================================================ */

const HEALTH_WINDOW=30; // days ahead we call "expiring soon" — configurable

function healthOf(){
  const soon=new Date(NOW.getTime()+HEALTH_WINDOW*DAY);
  let valid=0,expiring=0,expired=0,withdrawn=0,pending=0;
  CONSENTS.forEach(c=>{
    if(c.status==='Withdrawn'){ withdrawn++; return; }
    if(c.status==='Pending'){ pending++; return; }
    if(c.status==='Expired'||c.expires<NOW){ expired++; return; }
    if(c.expires<=soon){ expiring++; valid++; return; }   // still valid, but due
    valid++;
  });
  const total=CONSENTS.length;
  const score=Math.round(valid/total*100);
  return {total,valid,expiring,expired,withdrawn,pending,score};
}
function healthBand(s){
  if(s>=85) return {label:'Healthy',   col:'green', note:'The estate is in good shape. Keep an eye on renewals.'};
  if(s>=70) return {label:'Watch',     col:'blue',  note:'Broadly sound, with a renewal backlog worth clearing.'};
  if(s>=50) return {label:'Needs work',col:'amber', note:'A material share of consents can no longer be relied on.'};
  return       {label:'At risk',  col:'red',   note:'Most consents are not currently usable. Prioritise renewal.'};
}
/* health per purpose — share of that purpose's consents that are still valid */
function healthByPurpose(){
  return PURPOSES.map(p=>{
    const all=CONSENTS.filter(c=>c.purpose===p.id);
    const ok=all.filter(c=>c.status!=='Withdrawn'&&c.status!=='Pending'&&c.status!=='Expired'&&c.expires>=NOW).length;
    return {name:p.name, pct:all.length?Math.round(ok/all.length*100):0, total:all.length, mandatory:p.mandatory};
  }).sort((a,b)=>a.pct-b.pct);
}

function vHealth(){
  const h=healthOf(), b=healthBand(h.score), byP=healthByPurpose();
  const soon=new Date(NOW.getTime()+HEALTH_WINDOW*DAY);
  const dueList=CONSENTS
    .filter(c=>c.status==='Active'&&c.expires>=NOW&&c.expires<=soon)
    .sort((a,b)=>a.expires-b.expires).slice(0,6);

  V().innerHTML=`

  <div class="page-head">

        <div class="xs muted" style="margin-top:8px;max-width:230px;margin-left:auto;margin-right:auto;line-height:1.5">${b.note}</div>
      </div>
    </div>
    <div class="grid g2" style="align-content:start;gap:12px">
      ${hTile('Valid right now',nf(h.valid),'Usable for processing today','green','check')}
      ${hTile('Expiring in '+HEALTH_WINDOW+' days',nf(h.expiring),'Still valid — renew before they lapse','amber','clock')}
      ${hTile('Expired',nf(h.expired),'No longer usable. Treated as no consent.','red','x')}
      ${hTile('Withdrawn',nf(h.withdrawn),'Customer said no. Permanent unless re-given.','violet','lock')}
    </div>
  </div>

  <div class="grid g2 mt">
    <div class="card">
      <div class="card-h"><div><h2>Health by purpose</h2><div class="hint">Share of each purpose still valid · weakest first</div></div></div>
      <div class="card-b">
        ${byP.map(p=>{
          const col=p.pct>=85?'green':p.pct>=70?'blue':p.pct>=50?'amber':'red';
          return `<div style="margin-bottom:12px">
            <div class="row sp" style="margin-bottom:5px">
              <span style="font-size:13px;font-weight:600">${esc(p.name)}${p.mandatory?' <span class="bdg b-gray nodot" style="margin-left:5px">Mandatory</span>':''}</span>
              <span class="mono xs" style="color:var(--${col})">${p.pct}%</span>
            </div>
            <div class="mini-bar lg" style="margin:0"><i style="width:${Math.max(2,p.pct)}%;background:var(--${col})"></i></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Needs attention</h2><div class="hint">Expiring soonest</div></div>
        <div class="acts"><button class="btn btn-t btn-sm" onclick="go('#/repository')">View all</button></div></div>

          const days=Math.max(0,Math.ceil((c.expires-NOW)/DAY));
          return `<tr>
            <td><a class="lnk" onclick="go('#/repository/${c.id}')">${esc(c.cname)}</a><div class="xs muted mono">${c.id}</div></td>
            <td class="xs">${esc(c.pname)}</td>

          :`<tr><td colspan="3"><div class="empty"><div class="ic">${IC.check(20)}</div><h3>Nothing expiring</h3><p>No consents lapse in the next ${HEALTH_WINDOW} days.</p></div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  </div>

  <div class="note n-blue mt">${IC.info(15)}<div><b>How the score is worked out.</b> It is simply the share of all ${nf(h.total)} consent records that are usable today — not withdrawn, not expired, not still pending. Expiring records still count as valid until the day they lapse, which is why the renewal list above matters.</div></div>
  `;
}
function hTile(label,val,sub,col,ic){

}

/* count-up: animates a number without shifting layout */
function countUp(el,to,dur=900){
  if(!el) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=nf(to);return;}
  const t0=performance.now(), from=0;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=nf(Math.round(from+(to-from)*e));
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}
function runCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>countUp(el,+el.getAttribute('data-count')));
}
